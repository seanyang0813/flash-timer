name: Verify theorem site

on:
  push:
    branches:
      - matsumoto-motion
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Next.js site
        run: npm run build
      - name: Start production server and smoke-test routes
        run: |
          npm run start -- -p 3000 > /tmp/theorem-next.log 2>&1 &
          echo $! > /tmp/theorem-next.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/proof > /tmp/proof.html; then
              break
            fi
            sleep 1
          done
          test -s /tmp/proof.html
          grep -q "Proof inspector" /tmp/proof.html
          curl --fail --silent http://127.0.0.1:3000/ > /tmp/main.html
          grep -q "MATSUMOTO POWER TWISTS" /tmp/main.html
      - name: Capture desktop and mobile proof-inspector screenshots
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$BROWSER"
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1200 --screenshot=proof-desktop.png http://127.0.0.1:3000/proof
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --screenshot=proof-mobile.png http://127.0.0.1:3000/proof
          test -s proof-desktop.png
          test -s proof-mobile.png
      - name: Upload visual smoke-test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: proof-inspector-screenshots
          path: |
            proof-desktop.png
            proof-mobile.png
          retention-days: 7
      - name: Stop production server
        if: always()
        run: |
          if test -f /tmp/theorem-next.pid; then
            kill "$(cat /tmp/theorem-next.pid)" || true
          fi
          cat /tmp/theorem-next.log || true
